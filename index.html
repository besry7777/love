<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ข้าวเหนียวคำสุดท้าย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&family=Kanit:wght@400;700&family=Noto+Sans+Thai:wght@400;700&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1424;--pn:#18243D;--ac:#E8B76A;--tx:#F1E9D8;--mu:#A5A3A8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Prompt","Kanit","Noto Sans Thai","Sarabun",system-ui,sans-serif}
#app{min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#steps{display:flex;gap:6px;padding:8px 8px 4px}
.step{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border-radius:14px;background:#1c2a45;color:var(--tx);border:1px solid #2c3b5c;font:inherit;font-size:13px;cursor:pointer;padding:4px 6px;text-align:center}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--ac);color:#18243D;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.step.done{border-color:var(--ac);background:#24314f}
#status{font-size:12px;color:var(--mu);padding:0 12px 4px;min-height:18px}
#stage{position:relative;height:calc(100dvh - 200px - env(safe-area-inset-top) - env(safe-area-inset-bottom));min-height:320px;display:flex;align-items:center;justify-content:center}
#stage.fs,#stage:fullscreen{position:fixed;inset:0;height:100dvh;z-index:8;background:#000}
#cv{display:block;border-radius:14px;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.5);touch-action:manipulation}
#est{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(232,183,106,.94);color:#18243D;font-size:12px;padding:6px 12px;border-radius:999px;white-space:nowrap;pointer-events:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mu)}
#fsX{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;display:none}
#stage.fs #fsX{display:block}
#ctrl{display:flex;align-items:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.ic{min-width:48px;height:48px;border-radius:14px;border:0;background:#1c2a45;color:var(--tx);font-size:18px;cursor:pointer;font-family:inherit}
#seek{flex:1;height:48px;accent-color:var(--ac);min-width:50px}
#tm{font-size:12px;color:var(--mu);min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.pri{background:var(--ac)!important;color:#18243D!important;font-weight:700}
#bExp{padding:0 12px;font-size:14px}
details{margin:0 10px 16px;background:#141d33;border-radius:14px;padding:2px 10px}
summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-size:14px}
.srow{display:flex;align-items:center;gap:6px;padding:2px 0;border-top:1px solid #22304e}
.srow .nm{flex:1;text-align:left;background:none;border:0;color:var(--tx);font:inherit;font-size:13px;min-height:48px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow.on .nm{color:var(--ac)}
.srow .ad{min-width:52px;height:44px;border-radius:10px;border:0;background:#22304e;color:var(--tx);font:inherit;font-size:13px}
.srow .of{font-size:11px;color:var(--mu);min-width:42px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(8,12,22,.85);display:flex;align-items:center;justify-content:center;z-index:9;padding:14px}
.modal[hidden]{display:none}
.mcard{background:#18243D;border-radius:18px;padding:18px;width:min(460px,100%);max-height:94dvh;overflow:auto}
.mcard h2{margin:0 0 10px;font-size:20px}
.chk{display:flex;align-items:center;gap:10px;min-height:48px;font-size:15px}
.chk input{width:22px;height:22px;accent-color:var(--ac)}
.bar{height:12px;background:#0e1424;border-radius:8px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.row button,.btn{flex:1;min-height:48px;border-radius:14px;border:0;background:#2a3a5e;color:var(--tx);font:inherit;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.row button:disabled{opacity:.4}
#exInfo,#exTxt{font-size:13px;color:var(--mu);line-height:1.6;margin:6px 0}
#exVid{width:100%;max-height:52dvh;border-radius:12px;background:#000;margin-top:8px}
.hint{font-size:12px;color:var(--mu)}
</style>
</head>
<body>
<div id="app">
  <header id="steps">
    <label class="step" id="st1"><span class="n">1</span><span>นำเข้าเสียงพากย์</span><input type="file" id="file" accept="audio/*" hidden></label>
    <button class="step" id="st2"><span class="n">2</span><span>ดูตัวอย่าง</span></button>
    <button class="step" id="st3"><span class="n">3</span><span>สร้างวิดีโอ</span></button>
  </header>
  <div id="status">ยังไม่ได้นำเข้าเสียงพากย์</div>
  <main id="stage">
    <canvas id="cv" width="540" height="960"></canvas>
    <div id="est">เวลาโดยประมาณ ยังไม่ซิงก์กับเสียงจริง</div>
    <div id="loading">กำลังโหลดฟอนต์…</div>
    <button id="fsX" class="ic">✕</button>
  </main>
  <div id="ctrl">
    <button id="bPlay" class="ic" aria-label="เล่น">▶</button>
    <input type="range" id="seek" min="0" max="60" step="0.01" value="0" aria-label="เวลา">
    <span id="tm">0:00 / 0:00</span>
    <button id="bMute" class="ic" aria-label="ปิดเสียง">🔊</button>
    <button id="bFs" class="ic" aria-label="เต็มจอ">⛶</button>
    <button id="bExp" class="ic pri">สร้างวิดีโอ</button>
  </div>
  <details id="sync"><summary>รายการฉาก / ปรับจุดซิงก์</summary><div id="rows"></div></details>
</div>

<div id="ex" class="modal" hidden>
  <div class="mcard">
    <h2>สร้างวิดีโอ 9:16 · 30 FPS</h2>
    <label class="chk"><input type="checkbox" id="hq"> คุณภาพสูง 1080p</label>
    <p id="exInfo"></p>
    <div class="bar"><i id="exBar"></i></div>
    <p id="exTxt"></p>
    <div class="row"><button id="exGo" class="pri">เริ่มสร้าง</button><button id="exCancel" disabled>ยกเลิก</button><button id="exClose">ปิด</button></div>
    <div id="exRes" hidden>
      <video id="exVid" controls playsinline></video>
      <div class="row"><button id="exShare" class="pri">บันทึก/แชร์</button><a id="exDl" class="btn">ดาวน์โหลด</a></div>
      <p class="hint">ถ้าบันทึกไม่ได้ ให้กดค้างที่วิดีโอเพื่อบันทึก</p>
    </div>
  </div>
</div>

function fillRV(g,x,y,w,h,st){const gr=g.createLinearGradient(0,y,0,y+h);st.forEach((s,i)=>gr.addColorStop(i/(st.length-1),s));g.fillStyle=gr;g.fillRect(x,y,w,h);}

/* ================= TEXT WEIGHT & WRAP ================= */
const MARK=/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/;
function charW(s,i){const ch=s[i],p=s[i-1];
  if(ch==='\n')return p==='\n'?0:6;
  if(ch==='.'||ch==='…'||ch==='?'||ch==='!')return(p==='.'||p==='…')?0:6;
  if(ch===','||ch===' ')return 3;
  if(ch==='"'||ch==='“'||ch==='”')return 0;
  if(MARK.test(ch))return 0;return 1;}
function prefixW(s){const a=new Float32Array(s.length+1);for(let i=0;i<s.length;i++)a[i+1]=a[i]+charW(s,i);return a;}
const SCN=G4.map(s=>({pw:prefixW(s.narration)}));
const SEG=(window.Intl&&Intl.Segmenter)?new Intl.Segmenter('th',{granularity:'word'}):null;
const MC=mk(8,8).getContext('2d');
const SUBF=`700 56px ${FONT}`,SUB_LH=78,SUB_MAX=930;
function wrapF(text,font,max){MC.font=font;const words=SEG?[...SEG.segment(text)].map(s=>s.segment):text.split(/(\s+)/);
  const lines=[];let cur='',curOff=0,pos=0;
  for(const w of words){const test=cur+w;if(cur.trim()&&MC.measureText(test.trim()).width>max){lines.push({str:cur,off:curOff});cur=w;curOff=pos;}else cur=test;pos+=w.length;}
  if(cur.trim())lines.push({str:cur,off:curOff});
  return lines.map(l=>{const lead=l.str.length-l.str.trimStart().length;return{str:l.str.trim(),off:l.off+lead};});}
let CHUNKS=[];
function buildChunks(i){const nar=G4[i].narration,tokens=[],re=/\S+/g;let m;while((m=re.exec(nar)))tokens.push({s:m[0],i:m.index});
  const out=[];let cur=null;
  for(const tk of tokens){if(!cur){cur={start:tk.i,end:tk.i+tk.s.length};continue;}
    const brk=/\n/.test(nar.slice(cur.end,tk.i));const cand=nar.slice(cur.start,tk.i+tk.s.length).replace(/\s+/g,' ');
    if(!brk&&wrapF(cand,SUBF,SUB_MAX).length<=2)cur.end=tk.i+tk.s.length;else{out.push(cur);cur={start:tk.i,end:tk.i+tk.s.length};}}
  if(cur)out.push(cur);
  return out.map(ch=>{const text=nar.slice(ch.start,ch.end).replace(/\s+/g,' ');const mark=new Uint8Array(text.length);
    for(const w of G4[i].highlightWords||[]){let p=0;while((p=text.indexOf(w,p))>=0){mark.fill(1,p,p+w.length);p+=w.length;}}
    return{text,start:ch.start,lines:wrapF(text,SUBF,SUB_MAX),mark};});}

/* ================= SYNC / TIMELINE ================= */
let AUD=null,TL=null;const OFFS=G4.map(()=>0);
function buildTL(){const n=G4.length,Wt=SCN.map(x=>x.pw[x.pw.length-1]),SEP=6,total=Wt.reduce((a,b)=>a+b,0)+SEP*(n-1);
  const cuts=[],segs=[];let audOff,aEnd,onsets;
  if(AUD){const{sS,sE,pauses}=AUD,D=sE-sS;audOff=sS-LEAD;onsets=AUD.onsets;aEnd=Math.min(AUD.buf.duration,sE+0.35);let cum=0,prev=sS;
    for(let i=0;i<n-1;i++){cum+=Wt[i];const target=sS+D*(cum+SEP/2)/total;cum+=SEP;let best=null;
      for(const p of pauses){const c=(p.s+p.e)/2;if(Math.abs(c-target)<=1.2&&c>prev+0.3&&(!best||p.d>best.d))best=p;}
      const b=best?{c:(best.s+best.e)/2,s:best.s,e:best.e}:{c:Math.max(target,prev+0.5),s:Math.max(target,prev+0.5),e:Math.max(target,prev+0.5)};
      const c=Math.max(prev+0.3,b.c+OFFS[i+1]);cuts.push({c,s:Math.min(b.s,c),e:Math.max(b.e,c)});prev=c;}
    for(let i=0;i<n;i++){const a=i?cuts[i-1].e:sS,b=i<n-1?cuts[i].s:sE;segs.push([a,Math.max(b,a+0.2)]);}
  }else{audOff=-LEAD;onsets=[];let a=0,prev=0;
    for(let i=0;i<n;i++){const d=Wt[i]/11;segs.push([a,a+d]);onsets.push(a);a+=d;
      if(i<n-1){const c=Math.max(prev+0.3,a+0.25+OFFS[i+1]);cuts.push({c,s:a,e:a+0.5});prev=c;a+=0.5;}}
    aEnd=a+0.35;}
  const sc=[];let H=0;
  for(let i=0;i<n;i++){const a0=i?cuts[i-1].c:audOff,a1=i<n-1?cuts[i].c:aEnd,hold=G4[i].holdAfter||0;
    const start=a0-audOff+H;sc.push({start,end:a1-audOff+H+hold,a0,a1,H,seg:segs[i],hold});H+=hold;}
  TL={scenes:sc,audOff,onsets,T:sc[n-1].end};
  sc.forEach((S,i)=>{const g=G4[i];
    let lastT=-1;S.chunks=(CHUNKS[i]||[]).map((ch,k)=>{let t=k===0?S.start:Math.max(evIdx(i,ch.start),lastT+0.4);lastT=t;return{...ch,t};});
    S.cards=(g.cards||[]).map(cd=>({...cd,t:evTxt(i,cd.atText)}));
    S.sfx=(g.sfx||[]).map(x=>({...x,t:evTxt(i,x.atText)}));
    S.props=(g.props||[]).map(p=>({...p,t:p.appearAtText?evTxt(i,p.appearAtText):S.start}));
    S.moves=(g.actors||[]).map(a=>a.moveTo?evTxt(i,a.moveTo.atText):null);});
  const last=sc[n-1];for(const cd of last.cards)if(cd.type==='end_card')last.end=Math.max(last.end,cd.t+Math.max(cd.dur||0,2.5)+0.5);
  TL.T=last.end;}
function evIdx(i,idx){const S=TL.scenes[i],P=SCN[i].pw;const frac=P[Math.max(0,idx)]/P[P.length-1];let a=S.seg[0]+frac*(S.seg[1]-S.seg[0]);
  if(AUD){let best=null,bd=0.4;for(const o of TL.onsets){const d=Math.abs(o-a);if(d<=bd){bd=d;best=o;}}if(best!=null)a=best;}
  return clamp(a-S.a0+S.start,S.start,S.end-0.05);}
function evTxt(i,txt){const idx=txt?G4[i].narration.indexOf(txt):0;return evIdx(i,idx<0?0:idx);}
function sceneAt(t){const s=TL.scenes;let i=0;for(let k=0;k<s.length;k++)if(t>=s[k].start)i=k;return i;}
function v2a(v){const i=sceneAt(v),S=TL.scenes[i];const a=v-S.start+S.a0;return a>S.a1?null:a;}
function vlevel(v){if(!AUD)return 0;const a=v2a(v);if(a==null||a<0)return 0;const f=Math.floor(a/0.02),e=AUD.env;let s=0,n=0;for(let k=f-1;k<=f+1;k++)if(k>=0&&k<e.length){s+=e[k];n++;}return n?clamp(s/n/AUD.p95):0;}
function speaking(v){if(AUD)return vlevel(v)>0.12;const a=v2a(v);if(a==null)return false;const S=TL.scenes[sceneAt(v)];return a>=S.seg[0]&&a<=S.seg[1];}
function talkAmt(t){if(AUD)return clamp((vlevel(t)-0.08)*1.5);return speaking(t)?0.3+0.45*Math.abs(Math.sin(t*9.3))*Math.abs(Math.sin(t*3.7)):0;}

async function importAudio(file){ensureAC();setStatus('กำลังวิเคราะห์เสียง…');
  const ab=await file.arrayBuffer();const buf=await new Promise((res,rej)=>{const p=AC.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej);});
  const sr=buf.sampleRate,hop=Math.round(sr*0.02),n=Math.floor(buf.length/hop),chs=[];for(let i=0;i<buf.numberOfChannels;i++)chs.push(buf.getChannelData(i));
  const env=new Float32Array(n);
  for(let f=0;f<n;f++){let s=0;const o=f*hop;for(let j=0;j<hop;j++){let v=0;for(const c of chs)v+=c[o+j];v/=chs.length;s+=v*v;}env[f]=Math.sqrt(s/hop);}
  const sorted=Float32Array.from(env).sort();const p95=sorted[Math.floor(n*0.95)]||1e-4,thr=Math.max(p95*0.08,1e-5);
  let first=-1,last=-1;for(let f=0;f<n;f++)if(env[f]>thr){if(first<0)first=f;last=f;}
  if(first<0)throw new Error('ไม่พบเสียงพูดในไฟล์');
  const pauses=[];let rs=-1;
  for(let f=first;f<=last;f++){const sil=env[f]<=thr;if(sil&&rs<0)rs=f;if(!sil&&rs>=0){const d=(f-rs)*0.02;if(d>=0.22)pauses.push({s:rs*0.02,e:f*0.02,d});rs=-1;}}
  const sS=first*0.02,sE=(last+1)*0.02;
  AUD={buf,env,p95,thr,sS,sE,pauses,onsets:[sS,...pauses.map(p=>p.e)],name:file.name};
  buildTL();refreshAll();
  setStatus(`ซิงก์แล้ว: ${file.name} · พูด ${(sE-sS).toFixed(1)} วิ · พบช่วงหยุด ${pauses.length} จุด · วิดีโอ ${TL.T.toFixed(1)} วิ`);
  $('#st1').classList.add('done');$('#est').hidden=true;}

function drawSubs(c,i,t){const S=TL.scenes[i],chs=S.chunks;if(!chs||!chs.length)return;let j=-1;for(let k=0;k<chs.length;k++)if(t>=chs[k].t)j=k;if(j<0)return;

/* ================= AUDIO ENGINE (AudioContext + OfflineAudioContext) ================= */
let AC=null,MASTER=null,muted=false;
function chain(ctx,dest,g0=1){const comp=ctx.createDynamicsCompressor();comp.threshold.value=-8;comp.knee.value=4;comp.ratio.value=14;comp.attack.value=.002;comp.release.value=.15;comp.connect(dest);const g=ctx.createGain();g.gain.value=g0;g.connect(comp);return g;}
function ensureAC(){if(AC)return AC;const K=window.AudioContext||window.webkitAudioContext;AC=new K();MASTER=chain(AC,AC.destination,muted?0:1);return AC;}
const NB=new WeakMap();
function noiseBuf(ctx){let b=NB.get(ctx);if(!b){const n=ctx.sampleRate*2;b=ctx.createBuffer(1,n,ctx.sampleRate);const d=b.getChannelData(0),R=mulberry32(9);for(let i=0;i<n;i++)d[i]=R()*2-1;NB.set(ctx,b);}return b;}
const AT=(A,v)=>A.t0+(v-A.from);
function Gn(A,v,dest){const g=A.ctx.createGain();g.gain.value=v;g.connect(dest||A.out);return g;}
function reg(A,n){A.list.push(n);return n;}
function tone(A,o,type,f0,f1,t,dur,vol,att=.005){const c=A.ctx,os=reg(A,c.createOscillator()),g=c.createGain();os.type=type;os.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)os.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(att,dur*.5));g.gain.exponentialRampToValueAtTime(.0001,t+dur);os.connect(g);g.connect(o);os.start(t);os.stop(t+dur+.05);}
function nz(A,o,t,dur,vol,ft,f0,f1,q=1,att=.005){const c=A.ctx,s=reg(A,c.createBufferSource()),f=c.createBiquadFilter(),g=c.createGain();s.buffer=noiseBuf(c);s.loop=true;f.type=ft;f.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=q;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(att,dur*.5));g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(o);s.start(t,(t*7.3)%1.5);s.stop(t+dur+.05);}
function playSfx(A,name,t,vol){const o=Gn(A,vol);
  switch(name){
  case'whoosh':nz(A,o,t,.55,.9,'bandpass',300,2400,1.2,.2);break;
  case'hit':tone(A,o,'sine',160,45,t,.3,1);nz(A,o,t,.08,.5,'lowpass',2000,500);break;
  case'boom':tone(A,o,'sine',90,28,t,1.4,1);nz(A,o,t,1.2,.6,'lowpass',600,80);break;
  case'siren':for(let k=0;k<3;k++){tone(A,o,'square',600,900,t+k*.6,.3,.22,.02);tone(A,o,'square',900,600,t+k*.6+.3,.3,.22,.02);}break;
  case'footstep':for(let k=0;k<4;k++){nz(A,o,t+k*.42,.09,.8,'lowpass',700,300);tone(A,o,'sine',90,60,t+k*.42,.08,.4);}break;
  case'click':tone(A,o,'square',2200,1800,t,.035,.4,.001);tone(A,o,'square',1600,1400,t+.09,.03,.3,.001);break;
  case'pop':tone(A,o,'sine',350,900,t,.09,.8);break;
  case'wind':nz(A,o,t,3.2,.7,'bandpass',300,900,.8,1.2);break;
  case'rain':nz(A,o,t,3,.5,'highpass',2500,3000,.5,.4);break;
  case'heartbeat':for(const[d,v]of[[0,.9],[.24,.6],[.95,.9],[1.19,.6]])tone(A,o,'sine',70,40,t+d,.18,v,.01);break;
  case'door':nz(A,o,t,.7,.5,'bandpass',260,520,6,.05);tone(A,o,'sawtooth',110,160,t,.6,.1,.05);nz(A,o,t+.62,.15,.8,'lowpass',400,120);tone(A,o,'sine',80,45,t+.62,.2,.6);break;
  case'ding':tone(A,o,'sine',1320,0,t,1.6,.6);tone(A,o,'sine',2640,0,t,.9,.2);break;
  case'glitch':{const R=mulberry32(5);for(let k=0;k<8;k++)tone(A,o,'square',200+R()*1800,0,t+k*.04,.035,.25,.001);break;}
  case'laugh':for(let k=0;k<5;k++)tone(A,o,'triangle',320-k*15,260-k*15,t+k*.15,.11,.5,.01);break;
  case'sparkle':{const R=mulberry32(11);for(let k=0;k<7;k++)tone(A,o,'sine',2000+R()*2500,0,t+k*.07,.35,.25,.003);break;}
  case'alarm':for(let k=0;k<6;k++)tone(A,o,'square',k%2?660:880,0,t+k*.25,.22,.22,.005);break;
  case'typing':{const R=mulberry32(3);for(let k=0;k<10;k++)nz(A,o,t+k*.11+R()*.04,.03,.6,'highpass',3000,0,1,.001);break;}
  case'coin':tone(A,o,'square',988,0,t,.1,.3,.002);tone(A,o,'square',1319,0,t+.09,.4,.3,.002);break;
  case'error':tone(A,o,'sawtooth',200,190,t,.18,.35);tone(A,o,'sawtooth',150,140,t+.22,.25,.35);break;
  case'tick':tone(A,o,'sine',1500,0,t,.03,.5,.001);break;
  case'stamp':tone(A,o,'sine',120,40,t,.25,1,.002);nz(A,o,t,.12,.8,'lowpass',1500,300);break;
  case'paper':nz(A,o,t,.35,.6,'bandpass',2500,4000,1,.03);break;}}
function ambient(A,type,v0,v1){const c=A.ctx,s=Math.max(v0,A.from);if(!type||v1-s<.2)return;const t0=AT(A,s),t1=AT(A,v1),e=c.createGain();e.connect(A.out);
  e.gain.setValueAtTime(0,t0);e.gain.linearRampToValueAtTime(VOL.amb,t0+.6);e.gain.setValueAtTime(VOL.amb,Math.max(t0+.6,t1-.6));e.gain.linearRampToValueAtTime(0,t1);
  const bed=(ft,f,q,v)=>{const n=reg(A,c.createBufferSource()),fl=c.createBiquadFilter(),g=c.createGain();n.buffer=noiseBuf(c);n.loop=true;fl.type=ft;fl.frequency.value=f;fl.Q.value=q;g.gain.value=v;n.connect(fl);fl.connect(g);g.connect(e);n.start(t0,(v0*3.1)%1.5);n.stop(t1+.05);return fl;};
  const cricket=(f,rate,v)=>{const o=reg(A,c.createOscillator()),l1=reg(A,c.createOscillator()),l2=reg(A,c.createOscillator()),g1=c.createGain(),g2=c.createGain(),k1=c.createGain(),k2=c.createGain(),gv=c.createGain();
    o.frequency.value=f;l1.type='square';l1.frequency.value=rate;l2.type='square';l2.frequency.value=.8+f/20000;g1.gain.value=.5;g2.gain.value=.5;k1.gain.value=.5;k2.gain.value=.5;gv.gain.value=v;
    l1.connect(k1);k1.connect(g1.gain);l2.connect(k2);k2.connect(g2.gain);o.connect(g1);g1.connect(g2);g2.connect(gv);gv.connect(e);[o,l1,l2].forEach(n=>{n.start(t0);n.stop(t1+.05);});};

  case'room':bed('lowpass',260,.7,.6);break;
  case'city':bed('lowpass',600,.7,.7);bed('bandpass',1400,1,.12);break;
  case'wind':{const f=bed('bandpass',450,.8,.9),l=reg(A,c.createOscillator()),lg=c.createGain();l.frequency.value=.15;lg.gain.value=200;l.connect(lg);lg.connect(f.frequency);l.start(t0);l.stop(t1+.05);break;}
  case'rain':bed('highpass',2600,.5,.5);bed('lowpass',800,.5,.2);break;
  case'forest':bed('bandpass',1800,.6,.15);cricket(5200,22,.12);break;
  case'night_insects':bed('lowpass',400,.7,.25);cricket(4600,28,.22);cricket(5300,34,.14);break;}}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function pad(A,o,f,det,t,dur,vol){const c=A.ctx,os=reg(A,c.createOscillator()),g=c.createGain();os.type='triangle';os.frequency.value=f;os.detune.value=det;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.8);g.gain.setValueAtTime(vol,t+dur-.7);g.gain.linearRampToValueAtTime(0,t+dur);os.connect(g);g.connect(o);os.start(t);os.stop(t+dur+.05);}
function music(A){const c=A.ctx,T=TL.T,spb=60/G5.bpm,bar=spb*4,mg=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1500;lp.connect(mg);mg.connect(A.out);
  const quiet=v=>G5.quietScenes.includes(G4[sceneAt(v)].id);
  const lvl=v=>{const i=sceneAt(v),S=TL.scenes[i];let m=speaking(v)?VOL.musicDuck:VOL.music;if(quiet(v))m*=.75;
    if(G5.swells.some(s=>s.scene===G4[i].id))m*=1+.6*clamp((v-S.start)/(S.end-S.start));m*=clamp(v/2.5)*(G5.endStyle==='fade'?clamp((T-v)/3):1);return m;};

function voice(A){if(!AUD)return;const c=A.ctx,vg=Gn(A,VOL.voice);
  for(const S of TL.scenes){if(S.start+(S.a1-S.a0)<=A.from)continue;let vs=Math.max(S.start,A.from),a=vs-S.start+S.a0;if(a<0){vs-=a;a=0;}

function buildAudio(A){voice(A);music(A);
  TL.scenes.forEach((S,i)=>{ambient(A,G4[i].ambient,S.start,S.end);S.sfx.forEach(x=>{if(x.t>=A.from)playSfx(A,x.name,AT(A,x.t),VOL.sfx*clamp((x.vol??.5)*2,0,1.5));});});}

  buildAudio({ctx:AC,out:g,from:cur,t0:pT0,list:sess.list});playing=true;updBtn();$('#st2').classList.add('done');}
function pause(){if(!playing)return;cur=now();playing=false;stopSess();updBtn();dirty=true;}
function jump(t){const was=playing;if(was)pause();cur=clamp(t,0,TL.T);dirty=true;if(was)play();}
function nudge(i,d){OFFS[i]=Math.round((OFFS[i]+d)*10)/10;const was=playing;if(was)pause();buildTL();refreshAll();cur=TL.scenes[i].start+.01;dirty=true;if(was)play();}
function buildRows(){const box=$('#rows');box.innerHTML='';ROWS=G4.map((g,i)=>{const r=document.createElement('div');r.className='srow';
  r.innerHTML='<button class="nm"></button><button class="ad">−0.1</button><span class="of"></span><button class="ad">+0.1</button>';const[nm,m,of,p]=r.children;
  nm.textContent=`${g.id} · ${g.narration.replace(/\s+/g,' ').slice(0,26)}…`;nm.onclick=()=>jump(TL.scenes[i].start+.01);
  if(i===0){m.disabled=p.disabled=true;}m.onclick=()=>nudge(i,-.1);p.onclick=()=>nudge(i,.1);box.appendChild(r);return{r,of};});}
function refreshAll(){if(!TL)return;seekEl.max=TL.T.toFixed(2);
  ROWS.forEach((o,i)=>{o.of.textContent=TL.scenes[i].start.toFixed(1)+'s'+(OFFS[i]?` ${OFFS[i]>0?'+':''}${OFFS[i].toFixed(1)}`:'');});
  $('#est').hidden=!!AUD;lastScene=-1;dirty=true;}
function resize(){const st=$('#stage').getBoundingClientRect();let h=st.height-8,w=h*9/16;if(w>st.width-8){w=st.width-8;h=w*16/9;}
  cv.style.width=w+'px';cv.style.height=h+'px';const dpr=Math.min(2,devicePixelRatio||1),bw=Math.max(180,Math.min(1080,Math.round(w*dpr)));
  cv.width=bw;cv.height=Math.round(bw*16/9);scale=bw/DW;dirty=true;}
function frame(){requestAnimationFrame(frame);if(!TL||!dctx)return;let t=now();if(playing&&t>=TL.T){pause();cur=TL.T;t=cur;}
  if(playing||dirty){renderAtTime(dctx,t,scale);dirty=false;if(!seeking)seekEl.value=t;tmEl.textContent=`${fmtT(t)} / ${fmtT(TL.T)}`;
    const i=sceneAt(t);if(i!==lastScene){ROWS.forEach((o,k)=>o.r.classList.toggle('on',k===i));lastScene=i;}}}
$('#bPlay').onclick=()=>playing?pause():play();
$('#st2').onclick=()=>{if(!playing)play();};
cv.addEventListener('click',()=>playing?pause():play());
seekEl.addEventListener('input',()=>{seeking=true;if(playing){pause();resumeAfter=true;}cur=+seekEl.value;dirty=true;});
seekEl.addEventListener('change',()=>{seeking=false;cur=+seekEl.value;dirty=true;if(resumeAfter){resumeAfter=false;play();}});
$('#bMute').onclick=()=>{muted=!muted;if(MASTER)MASTER.gain.value=muted?0:1;$('#bMute').textContent=muted?'🔇':'🔊';};
document.head.insertAdjacentHTML('beforeend','<style>#stage:fullscreen #fsX{display:block}</style>');
function exitFs(){const st=$('#stage');if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});st.classList.remove('fs');setTimeout(resize,120);}
$('#bFs').onclick=()=>{const st=$('#stage');if(document.fullscreenElement||st.classList.contains('fs')){exitFs();return;}
  if(st.requestFullscreen)st.requestFullscreen().catch(()=>st.classList.add('fs'));else st.classList.add('fs');setTimeout(resize,120);};
$('#fsX').onclick=e=>{e.stopPropagation();exitFs();};
addEventListener('resize',resize);document.addEventListener('fullscreenchange',()=>setTimeout(resize,60));
document.addEventListener('pointerdown',()=>{try{ensureAC().resume();}catch(e){}},{once:true});
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(playing)pause();
  try{await importAudio(f);cur=0;dirty=true;}catch(err){setStatus('นำเข้าเสียงไม่สำเร็จ: '+(err&&err.message||err));}e.target.value='';};

/* ================= EXPORT ================= */
const MB_URLS=['https://cdn.jsdelivr.net/npm/mediabunny@1.11.0/+esm','https://cdn.jsdelivr.net/npm/mediabunny@1.0.0/+esm'];
let MB=null,EXP=null,LASTURL=null;
const isMobile=matchMedia('(pointer:coarse)').matches||Math.min(screen.width,screen.height)<700;
async function loadMB(){if(MB)return MB;let err;for(const u of MB_URLS){try{MB=await import(u);return MB;}catch(e){err=e;}}throw err||new Error('โหลด Mediabunny ไม่ได้');}
async function webcodecsOK(w,h){if(!('VideoEncoder'in window&&'AudioEncoder'in window&&'VideoFrame'in window))return false;
  try{const lv=w*h>921600?['avc1.640028','avc1.4d0028','avc1.420028']:['avc1.64001f','avc1.4d001f','avc1.42001f','avc1.640028'];let ok=false;
    for(const codec of lv){const r=await VideoEncoder.isConfigSupported({codec,width:w,height:h,bitrate:6e6,framerate:FPS});if(r&&r.supported){ok=true;break;}}
    if(!ok)return false;const a=await AudioEncoder.isConfigSupported({codec:'mp4a.40.2',sampleRate:48000,numberOfChannels:2,bitrate:128000});return!!(a&&a.supported);}catch(e){return false;}}
function pickMime(){if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)return null;
  for(const m of['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'])if(MediaRecorder.isTypeSupported(m))return m;return null;}
function dims(){const hq=$('#hq').checked;return hq?[1080,1920]:[720,1280];}
async function describe(){const[w,h]=dims();$('#exInfo').textContent='กำลังตรวจความสามารถของเครื่อง…';const a=await webcodecsOK(w,h),m=pickMime();
  let s=a?`จะใช้วิธี A: WebCodecs → MP4 (${w}×${h}) เร็วกว่าเรียลไทม์ ถ้าโหลดตัวประกอบ MP4 ไม่ได้จะสลับไปวิธี B อัตโนมัติ`:m?`จะใช้วิธี B: บันทึกแบบเรียลไทม์ (${m.split(';')[0]}) ต้องเปิดหน้านี้ค้างไว้ประมาณ ${Math.ceil(TL.T)} วินาที`:'เบราว์เซอร์นี้ไม่รองรับการสร้างวิดีโอ ลองใช้ Chrome หรือ Safari รุ่นล่าสุด';
  if(!AUD)s+=' · ยังไม่ได้นำเข้าเสียงพากย์ วิดีโอจะมีแค่เพลงและเอฟเฟกต์';$('#exInfo').textContent=s;$('#exGo').disabled=!a&&!m;return{a,m};}
function prog(f,N,t0,label){const p=N?Math.min(100,Math.round(f/N*100)):0;$('#exBar').style.width=p+'%';$('#exTxt').textContent=`${label||''}${p}% · เฟรม ${f}/${N} · ใช้เวลา ${((performance.now()-t0)/1000).toFixed(1)} วิ`;}
async function expA(w,h,N,T,t0){const mb=await loadMB();const{Output,Mp4OutputFormat,BufferTarget,CanvasSource,AudioBufferSource}=mb;
  const ecv=mk(w,h),ex=ecv.getContext('2d',{alpha:false});const out=new Output({format:new Mp4OutputFormat({fastStart:'in-memory'}),target:new BufferTarget()});
  const vs=new CanvasSource(ecv,{codec:'avc',bitrate:w>=1080?8e6:5e6});out.addVideoTrack(vs,{frameRate:FPS});
  const as=new AudioBufferSource({codec:'aac',bitrate:128e3});out.addAudioTrack(as);EXP.out=out;await out.start();
  $('#exTxt').textContent='กำลังเรนเดอร์เสียง…';const ab=await renderAudioOffline(T);await as.add(ab);
  for(let f=0;f<N;f++){if(EXP.cancel){try{await out.cancel();}catch(e){}throw new Error('ยกเลิกแล้ว');}
    renderAtTime(ex,f/FPS,w/DW);await vs.add(f/FPS,1/FPS);if(f%6===0){prog(f,N,t0,'วิธี A · ');await new Promise(r=>setTimeout(r,0));}}
  if(vs.close)vs.close();if(as.close)as.close();$('#exTxt').textContent='กำลังรวมไฟล์ MP4…';await out.finalize();prog(N,N,t0,'วิธี A · ');
  return{blob:new Blob([out.target.buffer],{type:'video/mp4'}),ext:'mp4'};}
async function expB(mime,w,h,T,N,t0){const ecv=mk(w,h),ex=ecv.getContext('2d');renderAtTime(ex,0,w/DW);ensureAC();await AC.resume();
  const msd=AC.createMediaStreamDestination(),m=chain(AC,msd),vstream=ecv.captureStream(FPS);
  const rec=new MediaRecorder(new MediaStream([...vstream.getVideoTracks(),...msd.stream.getAudioTracks()]),{mimeType:mime,videoBitsPerSecond:w>=1080?8e6:5e6});
  const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};const done=new Promise(r=>rec.onstop=r);
  const list=[],at0=AC.currentTime+.2;buildAudio({ctx:AC,out:m,from:0,t0:at0,list});rec.start(1000);
  await new Promise(res=>{const tick=()=>{if(EXP.cancel){res();return;}const t=AC.currentTime-at0;renderAtTime(ex,clamp(t,0,T),w/DW);prog(clamp(Math.floor(t*FPS),0,N),N,t0,'วิธี B (เรียลไทม์) · ');
    if(t>=T+.25){res();return;}setTimeout(tick,25);};tick();});
  rec.stop();await done;list.forEach(n=>{try{n.stop();}catch(e){}});try{m.disconnect();}catch(e){}vstream.getTracks().forEach(t=>t.stop());
  if(EXP.cancel)throw new Error('ยกเลิกแล้ว');if(!chunks.length)throw new Error('ไม่ได้ข้อมูลวิดีโอจาก MediaRecorder');
  const type=mime.split(';')[0];return{blob:new Blob(chunks,{type}),ext:type.includes('mp4')?'mp4':'webm'};}
function showResult(r){const name=`khao-niao-kham-sut-thai.${r.ext}`;if(LASTURL)URL.revokeObjectURL(LASTURL);LASTURL=URL.createObjectURL(r.blob);
  const vid=$('#exVid'),dl=$('#exDl'),bs=$('#exShare');vid.src=LASTURL;dl.href=LASTURL;dl.download=name;$('#exRes').hidden=false;
  const file=new File([r.blob],name,{type:r.blob.type});let can=false;try{can=!!(navigator.canShare&&navigator.canShare({files:[file]}));}catch(e){}
  bs.style.display=can?'':'none';bs.onclick=async()=>{try{await navigator.share({files:[file],title:G1.title});}catch(e){if(e.name!=='AbortError')dl.click();}};
  $('#exTxt').textContent+=` · เสร็จแล้ว (${r.ext.toUpperCase()}, ${(r.blob.size/1048576).toFixed(1)} MB)`;$('#st3').classList.add('done');}
async function runExport(){if(EXP)return;if(playing)pause();const[w,h]=dims(),T=TL.T,N=Math.ceil(T*FPS),t0=performance.now();
  EXP={cancel:false};$('#exGo').disabled=true;$('#exCancel').disabled=false;$('#hq').disabled=true;$('#exRes').hidden=true;$('#exBar').style.width='0%';
  let wl=null;try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen');}catch(e){}
  try{let res=null;
    if(await webcodecsOK(w,h)){try{res=await expA(w,h,N,T,t0);}catch(e){if(EXP.cancel)throw e;console.warn(e);$('#exInfo').textContent=`วิธี A ใช้ไม่ได้ (${e.message||e}) กำลังสลับไปวิธี B…`;}}
    if(!res&&!EXP.cancel){const mime=pickMime();if(!mime)throw new Error('เบราว์เซอร์นี้ไม่รองรับการสร้างวิดีโอทั้งสองวิธี');
      $('#exInfo').textContent=`วิธี B: บันทึกแบบเรียลไทม์ (${mime.split(';')[0]}) กรุณาเปิดหน้านี้ค้างไว้ อย่าสลับแอป`;res=await expB(mime,w,h,T,N,t0);}
    if(res)showResult(res);}
  catch(e){$('#exTxt').textContent=(e&&e.message==='ยกเลิกแล้ว')?'ยกเลิกการสร้างวิดีโอแล้ว':'สร้างวิดีโอไม่สำเร็จ: '+(e&&e.message||e);}
  finally{try{wl&&wl.release();}catch(e){}EXP=null;$('#exGo').disabled=false;$('#exCancel').disabled=true;$('#hq').disabled=false;}}
function openEx(){if(!TL)return;if(playing)pause();$('#ex').hidden=false;describe();}
$('#bExp').onclick=openEx;$('#st3').onclick=openEx;$('#hq').onchange=describe;$('#exGo').onclick=runExport;
$('#exCancel').onclick=()=>{if(EXP)EXP.cancel=true;};$('#exClose').onclick=()=>{if(EXP)EXP.cancel=true;$('#ex').hidden=true;};

/* ================= INIT ================= */
async function init(){dctx=cv.getContext('2d');$('#hq').checked=!isMobile;resize();
  try{await Promise.race([Promise.all([document.fonts.load(`700 56px Prompt`),document.fonts.load(`400 40px Prompt`),document.fonts.load(`700 56px "Noto Sans Thai"`)]).then(()=>document.fonts.ready),new Promise(r=>setTimeout(r,6000))]);}catch(e){}
  CHUNKS=G4.map((_,i)=>buildChunks(i));buildTL();buildRows();refreshAll();$('#loading').style.display='none';
  if(!AUD)setStatus(`ยังไม่ได้นำเข้าเสียงพากย์ · เวลาโดยประมาณ ${TL.T.toFixed(1)} วิ`);requestAnimationFrame(frame);}
init();
</script>
