<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>กฎ 5 ข้อในการอยู่หอพักข้างวัดป่า</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090B0D; --text: #f0f0f0; --primary: #9D2026; --panel: #17251D; --accent: #C5A45B;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { 
            background: var(--bg); color: var(--text); font-family: 'Prompt', sans-serif; 
            display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
        }
        #canvas-container {
            flex: 1; display: flex; justify-content: center; align-items: center;
            background: #000; position: relative; overflow: hidden;
        }
        canvas {
            max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
            display: flex; flex-direction: column; padding: 20px;
        }
        .panel {
            background: rgba(23, 37, 29, 0.9); border: 1px solid var(--accent); border-radius: 12px;
            padding: 15px; pointer-events: auto; backdrop-filter: blur(10px); margin-bottom: 10px;
        }
        .btn {
            background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 8px;
            font-family: 'Prompt', sans-serif; font-weight: 600; cursor: pointer; transition: 0.2s;
            display: inline-flex; align-items: center; justify-content: center; width: 100%; margin-top: 8px;
        }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { background: #464746; cursor: not-allowed; }
        .row { display: flex; gap: 10px; margin-top: 10px; }
        .row .btn { margin-top: 0; }
        
        #controls {
            padding: 15px 20px 30px; background: rgba(9, 11, 13, 0.95); display: flex; flex-direction: column; gap: 10px;
            border-top: 1px solid #333; z-index: 10; padding-bottom: env(safe-area-inset-bottom, 30px);
        }
        .scrubber { display: flex; align-items: center; gap: 10px; }
        input[type="range"] {
            flex: 1; accent-color: var(--primary); height: 6px; border-radius: 3px;
        }
        .time-display { font-size: 14px; font-variant-numeric: tabular-nums; width: 90px; text-align: center; }
        
        #sync-editor {
            position: absolute; right: -300px; top: 20px; width: 280px; height: calc(100% - 150px);
            background: var(--panel); border: 1px solid var(--accent); border-radius: 12px;
            padding: 15px; pointer-events: auto; transition: 0.3s; overflow-y: auto; z-index: 20;
        }
        #sync-editor.open { right: 20px; }
        .sync-item {
            background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; margin-bottom: 8px; font-size: 12px;
        }
        .sync-item-title { font-weight: 600; margin-bottom: 4px; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sync-controls { display: flex; justify-content: space-between; align-items: center; }
        .sync-btn { background: #333; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        
        #export-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; pointer-events: auto;
        }
        .progress-bar { width: 80%; height: 8px; background: #333; border-radius: 4px; margin: 20px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.1s; }
        #export-result { display: none; flex-direction: column; align-items: center; gap: 15px; width: 80%; max-width: 400px; }
        #export-result video { width: 100%; border-radius: 8px; border: 1px solid var(--accent); }
    </style>
</head>
<body>

<div id="canvas-container">
    <canvas id="main-canvas" width="1080" height="1920"></canvas>
    
    <div id="ui-layer">
        <div class="panel" id="setup-panel">
            <h3 style="color:var(--accent); font-size: 16px;">1. นำเข้าเสียงพากย์ (Voiceover)</h3>
            <p style="font-size: 12px; color: #A4AAA5; margin-top: 5px;">ระบบจะคำนวณจังหวะภาพตามเสียงอัตโนมัติ</p>
            <input type="file" id="audio-upload" accept="audio/*" style="display:none;">
            <button class="btn" onclick="document.getElementById('audio-upload').click()">อัปโหลดไฟล์เสียง</button>
            <button class="btn" id="btn-toggle-sync" style="background:#464746; display:none;" onclick="document.getElementById('sync-editor').classList.toggle('open')">ปรับแต่งจุดซิงก์ (Sync Editor)</button>
        </div>
    </div>
    
    <div id="sync-editor">
        <h3 style="color:var(--accent); font-size: 14px; margin-bottom: 10px;">ปรับจุดซิงก์ (วินาที)</h3>
        <div id="sync-list"></div>
        <button class="btn" onclick="document.getElementById('sync-editor').classList.remove('open')" style="background:#464746;">ปิด</button>
    </div>
    
    <div id="export-overlay">
        <div id="export-progress">
            <h2 style="color:var(--accent);">กำลังสร้างวิดีโอ...</h2>
            <p id="export-status" style="margin-top:10px; font-size:14px; text-align:center;">เตรียมการ (0%)</p>
            <div class="progress-bar"><div class="progress-fill" id="export-fill"></div></div>
            <button class="btn" id="btn-cancel-export" style="background:#464746;">ยกเลิก</button>
        </div>
        <div id="export-result">
            <h2 style="color:var(--accent);">วิดีโอพร้อมแล้ว!</h2>
            <video id="final-video" controls playsinline></video>
            <button class="btn" id="btn-save-video">บันทึกวิดีโอ / แชร์</button>
            <button class="btn" onclick="document.getElementById('export-overlay').style.display='none'" style="background:#464746;">ปิด</button>
        </div>
    </div>
</div>

<div id="controls">
    <div class="scrubber">
        <button class="btn" id="btn-play" style="width:auto; padding: 10px 20px;">▶</button>
        <input type="range" id="timeline" min="0" max="100" value="0" step="0.01">
        <div class="time-display" id="time-text">0.00 / 0.00</div>
    </div>
    <div class="row">
        <button class="btn" id="btn-mute" style="background:#464746; flex:0.5;">🔊</button>
        <button class="btn" id="btn-export" style="background:var(--primary); flex:1;">สร้างวิดีโอ (Export)</button>
    </div>
</div>

<script>
// ==========================================
// 1. G DATA & CONFIG
// ==========================================
const G = {
    project: "กฎ 5 ข้อในการอยู่หอพักข้างวัดป่า",
    format: "vertical_9:16", style: "REF-NIGHT",
    palette: { black: "#090B0D", green: "#17251D", gray: "#464746", yellow: "#C5A45B", red: "#9D2026", fog: "#A4AAA5", white: "#EBEBEB" },
    script: [
        { id: "S0", text: "ถ้าคุณต้องไปเช่าหอพักราคาถูก... ที่อยู่ติดกับวัดป่าแห่งหนึ่ง", bg: "room", char: "C1", pose: "sit", card: "none" },
        { id: "S1", text: "อย่าเพิ่งดีใจ เพราะหอพักแห่งนี้มีกฎอยู่ 5 ข้อ และเจ้าของหอบอกว่า... ถ้าไม่อยากเจอเรื่องแปลก ๆ ต้องทำตามให้ครบ", bg: "room", char: "C2", pose: "stand", card: "title_card", cardText: "กฎ 5 ข้อ\nหอพักข้างวัดป่า", sfx: ["whoosh"] },
        { id: "S2", text: "กฎข้อที่หนึ่ง หลังสามทุ่ม ห้ามเดินออกไปทางด้านหลังหอเด็ดขาด เพราะบางคืนคุณอาจเห็นพระเดินอยู่ในป่า... แต่ถ้ามองดี ๆ เท้าของท่านไม่ได้แตะพื้น", bg: "forest", card: "bignumber", cardText: "1", sfx: ["wind", "heartbeat"] },
        { id: "S3", text: "กฎข้อที่สอง ถ้าได้ยินเสียงระฆังดังตอนตีสอง ห้ามเปิดหน้าต่างออกไปดู เพราะวัดแห่งนี้ไม่มีระฆังมานานหลายสิบปีแล้ว", bg: "room", char: "C1", pose: "scared", card: "bignumber", cardText: "2", sfx: ["bell"] },
        { id: "S4", text: "กฎข้อที่สาม ถ้ามีคนมาเคาะประตูสามครั้งตอนเที่ยงคืน ห้ามถามว่าใคร และห้ามเปิดประตูเด็ดขาด โดยเฉพาะถ้าเสียงข้างนอกเป็นเสียงของคุณเอง", bg: "room_door", card: "bignumber", cardText: "3", sfx: ["knock"] },
        { id: "S5", text: "กฎข้อที่สี่ ถ้าเห็นคนยืนอยู่ใต้ต้นไม้ใหญ่ข้างกำแพงวัด อย่าจ้องตาเขา และอย่านับจำนวนคนที่ยืนอยู่ตรงนั้น... เพราะบางครั้งมันอาจเพิ่มขึ้นมาอีกหนึ่งคน", bg: "forest_tree", card: "bignumber", cardText: "4", sfx: ["boom"] },
        { id: "S6", text: "และกฎข้อที่ห้า ถ้าตื่นขึ้นมากลางดึกแล้วเห็นประตูห้องน้ำเปิดอยู่ ทั้งที่คุณจำได้ว่าปิดมันไว้... ให้หลับตาแล้วนอนนิ่ง ๆ จนกว่าจะได้ยินเสียงนาฬิกาปลุก", bg: "bathroom_door", char: "C1", pose: "sleep", card: "bignumber", cardText: "5", sfx: ["clock"] },
        { id: "S7", text: "แต่มีสิ่งหนึ่งที่เจ้าของหอไม่ได้เขียนไว้ในกฎ...", bg: "room", char: "C2", pose: "stare", card: "none", sfx: ["whoosh"] },
        { id: "S8", text: "ห้องที่คุณเช่าอยู่ คือห้องเดียวกับผู้เช่าคนก่อนที่หายตัวไป", bg: "room_dark", card: "none", sfx: ["glitch"] },
        { id: "S9", text: "และเมื่อคืนนี้... มีคนเพิ่งมาเคาะประตูห้องคุณสามครั้ง", bg: "room_door", char: "C1", pose: "terrified", card: "none", sfx: ["knock", "knock"] },
        { id: "S10", text: "โปรดติดตามตอนต่อไป...", bg: "black", card: "end_card", cardText: "จบ...", sfx: ["boom"] }
    ],
    characters: {
        C1: { name: "ผู้เช่า", body: "thin", hair: "short_black", top: "#333333", bottom: "#111", heightScale: 1.0 },
        C2: { name: "ป้า", body: "normal", hair: "tied_gray", top: "#17251D", bottom: "#111", heightScale: 0.95 }
    }
};

let syncData = [];
let totalDuration = G.script.length * 5; // Default if no audio
let isAudioLoaded = false;
let audioBuffer = null;
let audioRMS = [];

// ==========================================
// 2. AUDIO & SYNC ENGINE
// ==========================================
const actx = new (window.AudioContext || window.webkitAudioContext)();
const segmenter = window.Intl && Intl.Segmenter ? new Intl.Segmenter('th', { granularity: 'word' }) : null;

document.getElementById('audio-upload').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const arrayBuffer = await file.arrayBuffer();
    audioBuffer = await actx.decodeAudioData(arrayBuffer);
    analyzeAudioAndSync(audioBuffer);
});

function analyzeAudioAndSync(buffer) {
    const data = buffer.getChannelData(0);
    const sampleRate = buffer.sampleRate;
    const windowSize = Math.floor(sampleRate * 0.02); // 20ms
    audioRMS = [];
    let maxRMS = 0;
    
    for (let i = 0; i < data.length; i += windowSize) {
        let sum = 0;
        for (let j = 0; j < windowSize && (i+j) < data.length; j++) {
            sum += data[i+j] * data[i+j];
        }
        const rms = Math.sqrt(sum / windowSize);
        audioRMS.push(rms);
        if(rms > maxRMS) maxRMS = rms;
    }
    
    const threshold = maxRMS * 0.08;
    const pauses = []; // [timeInSeconds]
    let isSilent = true;
    let silentFrames = 0;
    
    for (let i = 0; i < audioRMS.length; i++) {
        if (audioRMS[i] < threshold) {
            silentFrames++;
            if(!isSilent && silentFrames > 11) { // ~220ms
                pauses.push((i * 0.02) - 0.1); 
                isSilent = true;
            }
        } else {
            isSilent = false;
            silentFrames = 0;
        }
    }
    
    // Distribute Script over duration
    totalDuration = buffer.duration;
    syncData = [];
    let totalWeight = 0;
    const weights = G.script.map(s => {
        let w = s.text.length;
        totalWeight += w;
        return w;
    });
    
    let currentTime = 0.5; // Start offset
    for(let i=0; i<G.script.length; i++) {
        const estDuration = (weights[i] / totalWeight) * (totalDuration - 1.0);
        let targetEnd = currentTime + estDuration;
        
        // Snap to nearest pause
        let bestPause = targetEnd;
        let minDiff = 999;
        for(let p of pauses) {
            if(p > currentTime && Math.abs(p - targetEnd) < 1.2) {
                if(Math.abs(p - targetEnd) < minDiff) { minDiff = Math.abs(p - targetEnd); bestPause = p; }
            }
        }
        
        if (i === G.script.length - 1) bestPause = totalDuration - 0.5;
        
        syncData.push({ id: G.script[i].id, start: currentTime, end: bestPause, text: G.script[i].text, duration: bestPause - currentTime });
        currentTime = bestPause;
    }
    
    isAudioLoaded = true;
    document.getElementById('setup-panel').style.display = 'none';
    document.getElementById('btn-toggle-sync').style.display = 'block';
    
    document.getElementById('timeline').max = totalDuration;
    buildSyncEditor();
    
    if(actx.state === 'suspended') actx.resume();
}

function buildSyncEditor() {
    const list = document.getElementById('sync-list');
    list.innerHTML = '';
    syncData.forEach((s, i) => {
        const d = document.createElement('div');
        d.className = 'sync-item';
        d.innerHTML = `
            <div class="sync-item-title">ฉาก ${i+1}: ${s.text.substring(0, 15)}...</div>
            <div class="sync-controls">
                <button class="sync-btn" onclick="adjSync(${i}, -0.1)">-0.1s</button>
                <span id="sync-val-${i}">${s.start.toFixed(1)}</span>
                <button class="sync-btn" onclick="adjSync(${i}, 0.1)">+0.1s</button>
            </div>
        `;
        list.appendChild(d);
    });
}
window.adjSync = (index, delta) => {
    if(index > 0) {
        syncData[index].start += delta;
        syncData[index-1].end += delta;
        document.getElementById(`sync-val-${index}`).innerText = syncData[index].start.toFixed(1);
        updateRender();
    }
};

// ==========================================
// 3. RENDER ENGINE (Canvas 9:16)
// ==========================================
const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
const W = 1080; const H = 1920;
let playTime = 0;
let isPlaying = false;
let reqAnim = null;
let lastSfxTime = -1;

function mulberry32(a) {
    return function() {
      var t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
}

// Ensure fonts loaded
document.fonts.ready.then(() => {
    if(!isAudioLoaded) {
        // Mock sync data for preview
        let ct = 0;
        syncData = G.script.map((s,i) => {
            let d = (s.text.length / 15);
            let obj = { id: s.id, start: ct, end: ct+d, text: s.text, duration: d };
            ct += d; return obj;
        });
        totalDuration = ct;
        document.getElementById('timeline').max = totalDuration;
    }
    updateRender();
});

function easeOutExpo(x) { return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); }
function easeInOutCubic(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }

function getSceneAtTime(t) {
    for(let i=0; i<syncData.length; i++) {
        if(t >= syncData[i].start && t <= syncData[i].end) return { idx: i, data: G.script[i], sync: syncData[i] };
    }
    return t < 0 ? { idx:0, data: G.script[0], sync: syncData[0] } : { idx: syncData.length-1, data: G.script[syncData.length-1], sync: syncData[syncData.length-1] };
}

// Background Drawing
const bgCache = {};
function drawBg(ctx, type, time) {
    if(!bgCache[type]) {
        const oc = document.createElement('canvas');
        oc.width = W; oc.height = H;
        const octx = oc.getContext('2d');
        
        // REF-NIGHT style bases
        const grad = octx.createLinearGradient(0,0,0,H);
        grad.addColorStop(0, G.palette.black);
        grad.addColorStop(1, G.palette.green);
        octx.fillStyle = grad;
        octx.fillRect(0,0,W,H);
        
        if(type.includes('room')) {
            // Room glow
            const rad = octx.createRadialGradient(W/2, H/3, 100, W/2, H/3, 800);
            rad.addColorStop(0, 'rgba(197, 164, 91, 0.15)'); // yellow glow
            rad.addColorStop(1, 'transparent');
            octx.fillStyle = rad; octx.fillRect(0,0,W,H);
            
            // Floor
            octx.fillStyle = G.palette.black;
            octx.fillRect(0, H*0.7, W, H*0.3);
            octx.strokeStyle = G.palette.gray; octx.lineWidth = 4;
            octx.beginPath(); octx.moveTo(0, H*0.7); octx.lineTo(W, H*0.7); octx.stroke();
            
            if(type === 'room' || type === 'room_dark') {
                // Window
                octx.fillStyle = '#05070a';
                octx.fillRect(W/2 - 200, 200, 400, 500);
                octx.strokeStyle = G.palette.gray; octx.lineWidth = 10;
                octx.strokeRect(W/2 - 200, 200, 400, 500);
                octx.beginPath(); octx.moveTo(W/2, 200); octx.lineTo(W/2, 700); octx.stroke();
                // Moon
                if(type === 'room') {
                    octx.fillStyle = G.palette.fog;
                    octx.beginPath(); octx.arc(W/2 + 80, 300, 40, 0, Math.PI*2); octx.fill();
                }
            }
            if(type === 'room_door' || type === 'bathroom_door') {
                // Door
                octx.fillStyle = '#111';
                octx.fillRect(W/2 - 180, 150, 360, 1200);
                octx.strokeStyle = G.palette.gray; octx.lineWidth = 8;
                octx.strokeRect(W/2 - 180, 150, 360, 1200);
                // Knob
                octx.fillStyle = G.palette.fog;
                octx.beginPath(); octx.arc(W/2 + 120, 750, 15, 0, Math.PI*2); octx.fill();
                
                if(type === 'bathroom_door') {
                    // Ajar door
                    octx.fillStyle = '#050505';
                    octx.fillRect(W/2 - 180, 150, 80, 1200);
                }
            }
        }
        else if(type.includes('forest')) {
            // Trees
            octx.fillStyle = '#050709';
            for(let i=0; i<8; i++) {
                let tx = 100 + i*150;
                octx.fillRect(tx, 0, 60, H);
                // Branches
                octx.beginPath(); octx.moveTo(tx+30, 400); octx.lineTo(tx+150, 300); octx.lineWidth = 20; octx.stroke();
            }
            // Fog
            const fog = octx.createLinearGradient(0, H*0.4, 0, H);
            fog.addColorStop(0, 'transparent');
            fog.addColorStop(1, 'rgba(164, 170, 165, 0.2)');
            octx.fillStyle = fog; octx.fillRect(0,0,W,H);
        }
        bgCache[type] = oc;
    }
    ctx.drawImage(bgCache[type], 0, 0);
    
    // Dynamic procedural elements
    if(type === 'forest_tree' || type === 'forest') {
        const rand = mulberry32(Math.floor(time * 10)); // flicker
        if(rand() > 0.8) {
            ctx.fillStyle = 'rgba(255,255,255,0.03)';
            ctx.fillRect(0,0,W,H);
        }
        // Silhouette entity
        if(type === 'forest_tree') {
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.ellipse(W/2, H*0.7, 60, 150, 0, 0, Math.PI*2); ctx.fill();
        }
        if(type === 'forest' && (time%4) > 2) { // floating monk
            ctx.fillStyle = '#000';
            let floatY = H*0.6 + Math.sin(time*2)*20;
            ctx.beginPath(); ctx.ellipse(W*0.7, floatY, 70, 180, 0, 0, Math.PI*2); ctx.fill();
            // Head
            ctx.beginPath(); ctx.arc(W*0.7, floatY-180, 40, 0, Math.PI*2); ctx.fill();
        }
    }
}

function drawCharacter(ctx, charId, x, y, pose, time, rms) {
    const c = G.characters[charId];
    if(!c) return;
    
    ctx.save();
    ctx.translate(x, y);
    
    // Scale for height & idle breathing
    let scale = c.heightScale;
    let bob = Math.sin(time * 3) * 5;
    ctx.scale(scale, scale);
    ctx.translate(0, bob);
    
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(0, 0, 100, 20, 0, 0, Math.PI*2); ctx.fill();
    
    // Capsule Body (REF-NIGHT style)
    ctx.fillStyle = c.bottom;
    ctx.fillRect(-45, -250, 90, 250); // Legs
    
    ctx.fillStyle = c.top;
    ctx.beginPath(); ctx.roundRect(-60, -500, 120, 260, 30); ctx.fill(); // Torso
    
    // Head (~25% of height)
    ctx.fillStyle = '#E5C298'; // Skin
    let hY = -550;
    
    if(pose === 'sit') { ctx.translate(0, 100); hY = -500; }
    if(pose === 'sleep') { ctx.rotate(Math.PI/2); ctx.translate(100, -200); }
    
    ctx.beginPath(); ctx.ellipse(0, hY, 75, 90, 0, 0, Math.PI*2); ctx.fill(); // Head base
    
    // Hair
    ctx.fillStyle = c.hair.includes('gray') ? '#555' : '#111';
    if(c.hair.includes('short')) {
        ctx.beginPath(); ctx.arc(0, hY-20, 80, Math.PI, 0); ctx.fill();
    } else {
        ctx.beginPath(); ctx.arc(0, hY-10, 80, Math.PI, 0); ctx.fill();
        ctx.beginPath(); ctx.arc(-70, hY+40, 30, 0, Math.PI*2); ctx.fill(); // Bun
    }
    
    // Face
    ctx.fillStyle = '#000';
    if(pose === 'scared' || pose === 'terrified') {
        ctx.beginPath(); ctx.ellipse(-25, hY-10, 10, 15, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(25, hY-10, 10, 15, 0, 0, Math.PI*2); ctx.fill();
        // Mouth
        ctx.beginPath(); ctx.ellipse(0, hY+30, 15, rms > 0.02 ? 20 + rms*100 : 20, 0, 0, Math.PI*2); ctx.fill();
    } else if(pose === 'sleep') {
        ctx.lineWidth = 3; ctx.strokeStyle = '#000';
        ctx.beginPath(); ctx.moveTo(-35, hY-10); ctx.lineTo(-15, hY-10); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(15, hY-10); ctx.lineTo(35, hY-10); ctx.stroke();
    } else {
        // Normal/Stare
        ctx.beginPath(); ctx.arc(-25, hY-10, 5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(25, hY-10, 5, 0, Math.PI*2); ctx.fill();
        // Talk mouth
        ctx.beginPath(); ctx.ellipse(0, hY+30, 10, rms > 0.02 ? 5 + rms*50 : 2, 0, 0, Math.PI*2); ctx.fill();
    }
    
    ctx.restore();
}

function drawCard(ctx, cardType, text, progress) {
    if(!cardType || cardType === 'none') return;
    
    ctx.save();
    let anim = easeOutExpo(Math.min(progress * 2, 1));
    let yOff = (1 - anim) * 50;
    ctx.globalAlpha = anim;
    
    if(cardType === 'title_card') {
        ctx.fillStyle = G.palette.white;
        ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 20;
        ctx.beginPath(); ctx.roundRect(100, 200 + yOff, 600, 250, 20); ctx.fill();
        ctx.shadowBlur = 0;
        
        ctx.fillStyle = G.palette.red;
        ctx.fillRect(100, 200 + yOff, 15, 250);
        
        ctx.fillStyle = G.palette.black;
        ctx.font = "bold 60px 'Prompt'";
        let lines = text.split('\n');
        lines.forEach((l, i) => ctx.fillText(l, 150, 290 + yOff + (i*70)));
    }
    else if(cardType === 'bignumber') {
        ctx.fillStyle = G.palette.white;
        ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 30;
        ctx.beginPath(); ctx.roundRect(W/2 - 150, 300 + yOff, 300, 300, 40); ctx.fill();
        ctx.shadowBlur = 0;
        
        ctx.fillStyle = G.palette.red;
        ctx.font = "bold 180px 'Prompt'";
        ctx.textAlign = 'center';
        ctx.fillText(text, W/2, 510 + yOff);
        
        ctx.fillStyle = G.palette.gray;
        ctx.font = "600 30px 'Prompt'";
        ctx.fillText("กฎข้อที่", W/2, 360 + yOff);
        ctx.textAlign = 'left';
    }
    else if(cardType === 'end_card') {
        ctx.fillStyle = 'rgba(9, 11, 13, 0.9)';
        ctx.fillRect(0,0,W,H);
        
        ctx.fillStyle = G.palette.white;
        ctx.textAlign = 'center';
        ctx.font = "bold 80px 'Prompt'";
        ctx.fillText(text, W/2, H/2 + yOff);
        ctx.textAlign = 'left';
    }
    ctx.restore();
}

function drawSubtitles(ctx, text, progress) {
    if(!text) return;
    ctx.save();
    ctx.textAlign = 'center';
    
    // Split and reveal text based on progress
    let words = segmenter ? Array.from(segmenter.segment(text)).map(s => s.segment) : text.split(' ');
    let revealCount = Math.floor(progress * words.length);
    let revText = words.slice(0, revealCount).join('');
    
    // Simple line wrap
    let lines = [];
    let currentLine = '';
    words.slice(0, revealCount).forEach(w => {
        if(ctx.measureText(currentLine + w).width > W - 100) {
            lines.push(currentLine); currentLine = w;
        } else {
            currentLine += w;
        }
    });
    if(currentLine) lines.push(currentLine);
    
    ctx.font = "bold 50px 'Prompt'";
    let startY = H * 0.75 - (lines.length * 30);
    
    lines.forEach((line, i) => {
        ctx.lineWidth = 6;
        ctx.strokeStyle = G.palette.black;
        ctx.strokeText(line, W/2, startY + (i*65));
        ctx.fillStyle = G.palette.white;
        ctx.fillText(line, W/2, startY + (i*65));
    });
    
    ctx.restore();
}

function renderAtTime(t) {
    const sceneInfo = getSceneAtTime(t);
    const scene = sceneInfo.data;
    const sync = sceneInfo.sync;
    
    // Progress in current scene
    let sProg = Math.max(0, Math.min(1, (t - sync.start) / sync.duration));
    
    // Global RMS logic for mouth/FX
    let currRMS = 0;
    if (audioRMS && audioRMS.length > 0) {
        let frameIdx = Math.floor(t / 0.02);
        if (frameIdx < audioRMS.length) currRMS = audioRMS[frameIdx];
    }
    
    // 1. Draw Background
    drawBg(ctx, scene.bg, t);
    
    // 2. Draw Characters
    if(scene.char) {
        drawCharacter(ctx, scene.char, W/2, H*0.8, scene.pose, t, currRMS);
    }
    
    // 3. Draw Card
    if(scene.card) {
        // Blur bg slightly if card exists
        if(scene.card !== 'none' && scene.card !== 'end_card') {
            ctx.fillStyle = 'rgba(9,11,13,0.4)'; ctx.fillRect(0,0,W,H);
        }
        drawCard(ctx, scene.card, scene.cardText, sProg);
    }
    
    // 4. Draw Subtitles
    drawSubtitles(ctx, scene.text, sProg);
    
    // 5. Trigger SFX (Preview only, not in export rendering loop)
    if(isPlaying && !isExporting && scene.sfx && lastSfxTime < sync.start) {
        lastSfxTime = sync.start;
        scene.sfx.forEach((fx, idx) => {
            setTimeout(() => playSfx(fx), idx * 400); // Stagger multiple SFX
        });
    }
}

// ==========================================
// 4. SFX SYNTHESIZER
// ==========================================
function playSfx(type) {
    if(document.getElementById('btn-mute').textContent === '🔇') return;
    const t = actx.currentTime;
    
    if(type === 'whoosh') {
        const osc = actx.createOscillator(); const gain = actx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(200, t); osc.frequency.exponentialRampToValueAtTime(40, t+0.5);
        gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(0.3, t+0.1); gain.gain.exponentialRampToValueAtTime(0.01, t+0.5);
        osc.connect(gain); gain.connect(actx.destination); osc.start(t); osc.stop(t+0.5);
    }
    else if(type === 'knock') {
        const osc = actx.createOscillator(); const gain = actx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(100, t); osc.frequency.exponentialRampToValueAtTime(20, t+0.1);
        gain.gain.setValueAtTime(0.8, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.1);
        osc.connect(gain); gain.connect(actx.destination); osc.start(t); osc.stop(t+0.1);
    }
    else if(type === 'boom') {
        const osc = actx.createOscillator(); const gain = actx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(80, t); osc.frequency.exponentialRampToValueAtTime(20, t+1.5);
        gain.gain.setValueAtTime(0.5, t); gain.gain.exponentialRampToValueAtTime(0.01, t+1.5);
        osc.connect(gain); gain.connect(actx.destination); osc.start(t); osc.stop(t+1.5);
    }
    else if(type === 'bell') {
        const osc = actx.createOscillator(); const gain = actx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, t); osc.frequency.linearRampToValueAtTime(590, t+2);
        gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(0.4, t+0.05); gain.gain.exponentialRampToValueAtTime(0.01, t+2);
        osc.connect(gain); gain.connect(actx.destination); osc.start(t); osc.stop(t+2);
    }
    else if(type === 'heartbeat') {
        playSfx('knock'); setTimeout(() => playSfx('knock'), 200);
    }
    else if(type === 'clock') {
        const osc = actx.createOscillator(); const gain = actx.createGain();
        osc.type = 'square'; osc.frequency.setValueAtTime(800, t);
        gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.05);
        osc.connect(gain); gain.connect(actx.destination); osc.start(t); osc.stop(t+0.05);
    }
}

// ==========================================
// 5. PLAYBACK CONTROL
// ==========================================
let playStartTime = 0;
let audioSource = null;
const timeline = document.getElementById('timeline');
const timeText = document.getElementById('time-text');
const btnPlay = document.getElementById('btn-play');

function updateRender() {
    renderAtTime(playTime);
    timeline.value = playTime;
    timeText.innerText = `${playTime.toFixed(1)} / ${totalDuration.toFixed(1)}`;
}

function loop() {
    if(!isPlaying) return;
    playTime = (actx.currentTime - playStartTime) % totalDuration;
    updateRender();
    if(playTime >= totalDuration - 0.1) stopPlayback();
    else reqAnim = requestAnimationFrame(loop);
}

function startPlayback() {
    if(actx.state === 'suspended') actx.resume();
    isPlaying = true; btnPlay.innerText = '⏸';
    playStartTime = actx.currentTime - playTime;
    
    if(isAudioLoaded && audioBuffer) {
        if(audioSource) audioSource.disconnect();
        audioSource = actx.createBufferSource();
        audioSource.buffer = audioBuffer;
        audioSource.connect(actx.destination);
        audioSource.start(0, playTime);
    }
    lastSfxTime = playTime - 0.1;
    loop();
}

function stopPlayback() {
    isPlaying = false; btnPlay.innerText = '▶';
    cancelAnimationFrame(reqAnim);
    if(audioSource) { audioSource.stop(); audioSource.disconnect(); audioSource = null; }
}

btnPlay.onclick = () => { if(isPlaying) stopPlayback(); else startPlayback(); };
timeline.oninput = (e) => {
    playTime = parseFloat(e.target.value);
    if(isPlaying) { stopPlayback(); startPlayback(); }
    else { updateRender(); lastSfxTime = playTime; }
};
document.getElementById('btn-mute').onclick = (e) => {
    let m = e.target.innerText === '🔊';
    e.target.innerText = m ? '🔇' : '🔊';
    // Simple mute logic (requires master gain node in real app, here we just stop sfx)
};


// ==========================================
// 6. EXPORT ENGINE (MediaRecorder Fallback Focus for reliability)
// ==========================================
let isExporting = false;
let exportRecorder = null;
let exportChunks = [];

document.getElementById('btn-export').onclick = async () => {
    if(isExporting) return;
    isExporting = true;
    stopPlayback();
    playTime = 0;
    
    document.getElementById('export-overlay').style.display = 'flex';
    document.getElementById('export-progress').style.display = 'block';
    document.getElementById('export-result').style.display = 'none';
    document.getElementById('export-status').innerText = 'กำลังเรนเดอร์ภาพ...';
    
    // Lock Wake
    let wakeLock = null;
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
    
    // Render loop for MediaRecorder (Realtime)
    const stream = canvas.captureStream(30);
    
    // Add audio track if available
    let dest = actx.createMediaStreamDestination();
    if(audioBuffer) {
        const src = actx.createBufferSource();
        src.buffer = audioBuffer;
        src.connect(dest);
        src.start();
        stream.addTrack(dest.stream.getAudioTracks()[0]);
    }
    
    let mime = 'video/mp4';
    if(!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm;codecs=vp9';
    if(!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';
    
    exportRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 5000000 });
    exportChunks = [];
    exportRecorder.ondataavailable = e => exportChunks.push(e.data);
    exportRecorder.onstop = () => {
        const blob = new Blob(exportChunks, { type: mime });
        const url = URL.createObjectURL(blob);
        const vid = document.getElementById('final-video');
        vid.src = url;
        
        document.getElementById('export-progress').style.display = 'none';
        document.getElementById('export-result').style.display = 'flex';
        
        document.getElementById('btn-save-video').onclick = () => {
            const ext = mime.includes('mp4') ? 'mp4' : 'webm';
            const a = document.createElement('a');
            a.href = url;
            a.download = `horror_explainer.${ext}`;
            a.click();
        };
        
        if(wakeLock) wakeLock.release();
        isExporting = false;
        playTime = 0;
        updateRender();
    };
    
    exportRecorder.start();
    
    // Drive rendering in real-time
    const startTime = performance.now();
    const renderTick = () => {
        if(!isExporting) { exportRecorder.stop(); return; }
        playTime = (performance.now() - startTime) / 1000;
        if(playTime >= totalDuration) {
            exportRecorder.stop();
        } else {
            renderAtTime(playTime);
            document.getElementById('export-fill').style.width = `${(playTime/totalDuration)*100}%`;
            document.getElementById('export-status').innerText = `กำลังบันทึกวิดีโอ... ${(playTime/totalDuration*100).toFixed(0)}%`;
            requestAnimationFrame(renderTick);
        }
    };
    renderTick();
};

document.getElementById('btn-cancel-export').onclick = () => {
    isExporting = false; // Will trigger stop in renderTick
};

</script>
