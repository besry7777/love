<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>C++ 3D Sandbox (Multi-Includes)</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: rgba(21, 25, 40, 0.85);
            --accent: #00e5ff;
            --error: #ff3366;
            --text-main: #e0e6ed;
            --comment: #637777;
            --keyword: #ff7b72;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
        }

        #viewport-3d {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        #top-bar {
            position: absolute;
            top: env(safe-area-inset-top, 10px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 15px;
            background: var(--panel-bg);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #2a3143;
            backdrop-filter: blur(5px);
        }

        button {
            background: none; border: none; color: white;
            font-size: 16px; font-weight: bold; padding: 5px 10px;
            cursor: pointer;
        }
        
        .btn-run { color: #00e5ff; }
        .btn-stop { color: #ff3366; }

        #bottom-editor {
            position: absolute;
            bottom: env(safe-area-inset-bottom, 0);
            left: env(safe-area-inset-left, 0);
            right: env(safe-area-inset-right, 0);
            height: 45%; 
            background: var(--panel-bg);
            border-top: 2px solid var(--accent);
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        #code-area {
            flex-grow: 1;
            background: #151928;
            color: #c3ccdf;
            border: none;
            padding: 15px;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
        }

        .error-text { color: var(--error); }
        .success-text { color: #00e5ff; }
        .sys-text { color: #a6accd; }

        #console-area {
            height: 50px; /* ขยายคอนโซลนิดนึงให้เห็นตอนโหลด Lib */
            background: #0a0c13;
            color: #00e5ff;
            font-size: 12px;
            padding: 5px 10px;
            border-top: 1px solid #2a3143;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="viewport-3d"></div>

    <div id="top-bar">
        <button class="btn-run" onclick="runSimulation()">▶ RUN</button>
        <button class="btn-stop" onclick="resetScene()">↻ RESET</button>
    </div>

    <div id="bottom-editor">
        <textarea id="code-area" spellcheck="false">#include <iostream>
#include <string>
#include <vector>
#include <Engine3D.h>
#include <Math3D.h>

using namespace std;

int main() {
    // กำหนดพิกัดเริ่มต้น
    float spawnX = 5.0;
    float spawnY = 2.0;
    float spawnZ = -2.0;

    // สร้างกล่องตามพิกัด
    CreateCube("PlayerBox", spawnX, spawnY, spawnZ);

    return 0;
}</textarea>
        <div id="console-area"><div class="sys-text">> System Ready. Waiting for build...</div></div>
    </div>

    <script>
        // --- 1. ส่วนของ 3D Engine (เหมือนเดิม) ---
        let scene, camera, renderer;
        let objects = [];

        function init3D() {
            const container = document.getElementById('viewport-3d');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1e2d);
            scene.fog = new THREE.Fog(0x1a1e2d, 10, 50);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 5, 15);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            const gridHelper = new THREE.GridHelper(30, 30, 0x00e5ff, 0x444444);
            scene.add(gridHelper);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            objects.forEach(obj => {
                obj.rotation.x += 0.01;
                obj.rotation.y += 0.01;
            });
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init3D();

        // --- 2. ระบบ Console แบบเพิ่มบรรทัดได้ ---
        const consoleArea = document.getElementById('console-area');

        function clearConsole() {
            consoleArea.innerHTML = '';
        }

        function logConsole(msg, type="sys-text") {
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = msg;
            consoleArea.appendChild(div);
            // เลื่อน scroll ลงล่างสุดอัตโนมัติ
            consoleArea.scrollTop = consoleArea.scrollHeight; 
        }

        function resetScene() {
            objects.forEach(obj => scene.remove(obj));
            objects = [];
            clearConsole();
            logConsole("> Scene reset.", "success-text");
        }

        // --- 3. ระบบจำลองการ Compile & Run ---
        async function runSimulation() {
            resetScene();
            const code = document.getElementById('code-area').value;
            
            logConsole("> Starting Build Task...", "sys-text");

            // ดึง #include ทั้งหมดจากโค้ด
            const includeRegex = /#include\s+<([^>]+)>/g;
            let matchInclude;
            const includedLibs = [];
            
            while ((matchInclude = includeRegex.exec(code)) !== null) {
                includedLibs.push(matchInclude[1]);
            }

            // จำลองเวลาโหลด Library แต่ละตัวให้ดูเท่ๆ
            for(let lib of includedLibs) {
                logConsole(`> Linking &lt;${lib}&gt;... OK`);
                // หน่วงเวลาเล็กน้อยให้เหมือนกำลัง Compile
                await new Promise(r => setTimeout(r, 100)); 
            }

            // ตรวจสอบ Library ที่จำเป็น
            if (!includedLibs.includes('Engine3D.h')) {
                logConsole("> Fatal Error: Cannot resolve 3D functions. Missing &lt;Engine3D.h&gt;", "error-text");
                return;
            }

            // ตรวจสอบ using namespace std;
            if (!code.includes('using namespace std;')) {
                logConsole("> Warning: 'std' namespace not declared. Proceeding anyway...", "sys-text");
            }

            // ตรวจสอบ Entry Point
            const mainRegex = /int\s+main\s*\(\s*\)\s*\{([\s\S]*)\}/;
            const mainMatch = code.match(mainRegex);
            
            if (!mainMatch) {
                logConsole("> Error: Entry point 'int main()' not found.", "error-text");
                return;
            }

            const mainBody = mainMatch[1];
            
            // เริ่มจำลองการประมวลผลโค้ดใน main()
            try {
                let xValue = 0, yValue = 0, zValue = 0;
                
                const varRegex = /float\s+([a-zA-Z_]\w*)\s*=\s*([-0-9.]+);/g;
                let match;
                const variables = {}; 

                while ((match = varRegex.exec(mainBody)) !== null) {
                    variables[match[1]] = parseFloat(match[2]);
                }

                const cubeRegex = /CreateCube\s*\(\s*"([^"]+)"\s*,\s*([a-zA-Z_]\w*\vert{}[-0-9.]+)\s*,\s*([a-zA-Z_]\w*\vert{}[-0-9.]+)\s*,\s*([a-zA-Z_]\w*\vert{}[-0-9.]+)\s*\);/;
                const cubeMatch = mainBody.match(cubeRegex);

                if (cubeMatch) {
                    const cubeName = cubeMatch[1];
                    const getVal = (valStr) => variables[valStr] !== undefined ? variables[valStr] : parseFloat(valStr);
                    
                    xValue = getVal(cubeMatch[2]);
                    yValue = getVal(cubeMatch[3]);
                    zValue = getVal(cubeMatch[4]);

                    if (isNaN(xValue) || isNaN(yValue) || isNaN(zValue)) {
                        logConsole(`> Runtime Error: Undefined variable used in CreateCube.`, "error-text");
                        return;
                    }

                    // สร้าง 3D Object
                    const geometry = new THREE.BoxGeometry(2, 2, 2);
                    const material = new THREE.MeshStandardMaterial({ color: 0x00e5ff });
                    const cube = new THREE.Mesh(geometry, material);
                    cube.position.set(xValue, yValue, zValue);
                    scene.add(cube);
                    objects.push(cube);
                    
                    logConsole(`> Executed: Created '${cubeName}' at (${xValue}, ${yValue}, ${zValue})`, "success-text");
                } else {
                    logConsole("> Build finished. 0 errors, 0 warnings. (No 3D objects created)", "success-text");
                }

            } catch (error) {
                logConsole("> Syntax error inside main(). Missing semicolon?", "error-text");
            }
        }
    </script>
</body>
</html>
