<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>C++ 3D Sandbox (Smart Compiler)</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: rgba(21, 25, 40, 0.85);
            --accent: #00e5ff;
            --error: #ff3366;
            --text-main: #e0e6ed;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
        }

        #viewport-3d {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        #top-bar {
            position: absolute;
            top: env(safe-area-inset-top, 10px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 15px;
            background: var(--panel-bg);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #2a3143;
            backdrop-filter: blur(5px);
        }

        button {
            background: none; border: none; color: white;
            font-size: 16px; font-weight: bold; padding: 5px 10px;
            cursor: pointer;
        }
        
        .btn-run { color: #00e5ff; }
        .btn-stop { color: #ff3366; }

        #bottom-editor {
            position: absolute;
            bottom: env(safe-area-inset-bottom, 0);
            left: env(safe-area-inset-left, 0);
            right: env(safe-area-inset-right, 0);
            height: 45%; 
            background: var(--panel-bg);
            border-top: 2px solid var(--accent);
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        #code-area {
            flex-grow: 1;
            background: #151928;
            color: #c3ccdf;
            border: none;
            padding: 15px;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
        }

        .error-text { color: var(--error); }
        .success-text { color: #00e5ff; }
        .sys-text { color: #a6accd; }

        #console-area {
            height: 60px;
            background: #0a0c13;
            color: #00e5ff;
            font-size: 12px;
            padding: 5px 10px;
            border-top: 1px solid #2a3143;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="viewport-3d"></div>

    <div id="top-bar">
        <button class="btn-run" onclick="runSimulation()">▶ RUN</button>
        <button class="btn-stop" onclick="resetScene()">↻ RESET</button>
    </div>

    <div id="bottom-editor">
        <textarea id="code-area" spellcheck="false">#include <iostream>
#include <Engine3D.h>

using namespace std;

int main() {
    float y = 6.0;

    // ถ้า y สูงกว่า 5 กล่องจะเป็นสีแดง (0xff3366)
    // ถ้าต่ำกว่า 5 กล่องจะเป็นสีฟ้า (0x00e5ff)
    int boxColor;

    if (y > 5.0) {
        boxColor = 0xff3366; 
        cout << "Warning: Box is very high!";
    } else {
        boxColor = 0x00e5ff;
        cout << "Box is at safe height.";
    }

    CreateCube("LogicBox", 0.0, y, 0.0, boxColor);

    return 0;
}</textarea>
        <div id="console-area"><div class="sys-text">> System Ready. Smart Compiler Active.</div></div>
    </div>

    <script>
        // --- 1. ส่วนของ 3D Engine ---
        let scene, camera, renderer;
        let objects = [];

        function init3D() {
            const container = document.getElementById('viewport-3d');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1e2d);
            scene.fog = new THREE.Fog(0x1a1e2d, 10, 50);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 5, 15);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            const gridHelper = new THREE.GridHelper(30, 30, 0x00e5ff, 0x444444);
            scene.add(gridHelper);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            objects.forEach(obj => {
                obj.rotation.x += 0.01;
                obj.rotation.y += 0.01;
            });
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init3D();

        // --- 2. ระบบ Console ---
        const consoleArea = document.getElementById('console-area');

        function clearConsole() { consoleArea.innerHTML = ''; }

        function logConsole(msg, type="sys-text") {
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = msg;
            consoleArea.appendChild(div);
            consoleArea.scrollTop = consoleArea.scrollHeight; 
        }

        function resetScene() {
            objects.forEach(obj => scene.remove(obj));
            objects = [];
            clearConsole();
            logConsole("> Scene reset.", "sys-text");
        }

        // API สำหรับให้ C++ เรียกใช้
        function api_CreateCube(name, x, y, z, colorHex = 0x00e5ff) {
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = new THREE.MeshStandardMaterial({ color: colorHex });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(x, y, z);
            scene.add(cube);
            objects.push(cube);
            logConsole(`> [3D] Created '${name}' at (${x}, ${y}, ${z})`, "success-text");
        }

        // --- 3. Smart Compiler (C++ to JS Transpiler) ---
        function runSimulation() {
            resetScene();
            const code = document.getElementById('code-area').value;
            
            if (!code.includes('#include <Engine3D.h>')) {
                return logConsole("> Error: Missing &lt;Engine3D.h&gt;", "error-text");
            }

            const mainRegex = /int\s+main\s*\(\s*\)\s*\{([\s\S]*)\}/;
            const mainMatch = code.match(mainRegex);
            
            if (!mainMatch) {
                return logConsole("> Error: Entry point 'int main()' not found.", "error-text");
            }

            let mainBody = mainMatch[1];

            // ลบ return 0; ออก
            mainBody = mainBody.replace(/return\s+0\s*;/g, '');

            // แปลงไวยากรณ์ C++ พื้นฐานให้เป็น JS เพื่อจำลองการรัน
            let jsCode = mainBody
                // แปลง float, int เป็น let
                .replace(/(?:float|int|double|string|bool)\s+([a-zA-Z_]\w*)/g, 'let $1')
                // แปลง cout << "..."
                .replace(/cout\s*<<\s*"([^"]*)"\s*(?:<<\s*endl\s*)?;/g, 'logConsole("> [C++] $1", "success-text");')
                // เชื่อม CreateCube เข้ากับ API
                .replace(/CreateCube/g, 'api_CreateCube');

            try {
                // สร้างฟังก์ชันจำลองและรันโค้ด
                const sandbox = new Function('api_CreateCube', 'logConsole', jsCode);
                sandbox(api_CreateCube, logConsole);
            } catch (error) {
                logConsole(`> Runtime Error: ${error.message} (Check your variables or syntax)`, "error-text");
            }
        }
    </script>
</body>
</html>
