<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>C++ 3D Mobile Sandbox (Interactive)</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: rgba(21, 25, 40, 0.85);
            --accent: #00e5ff;
            --text-main: #e0e6ed;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
        }

        #viewport-3d {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        #top-bar {
            position: absolute;
            top: env(safe-area-inset-top, 10px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 15px;
            background: var(--panel-bg);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #2a3143;
            backdrop-filter: blur(5px);
        }

        button {
            background: none; border: none; color: white;
            font-size: 16px; font-weight: bold; padding: 5px 10px;
            cursor: pointer;
        }
        
        .btn-run { color: #00e5ff; }
        .btn-stop { color: #ff3366; }

        #bottom-editor {
            position: absolute;
            bottom: env(safe-area-inset-bottom, 0);
            left: env(safe-area-inset-left, 0);
            right: env(safe-area-inset-right, 0);
            height: 40%; 
            background: var(--panel-bg);
            border-top: 2px solid var(--accent);
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        #code-area {
            flex-grow: 1;
            background: transparent;
            color: #a6accd;
            border: none;
            padding: 10px;
            font-size: 14px;
            resize: none;
            outline: none;
        }

        #console-area {
            height: 30px;
            background: #111424;
            color: #00e5ff;
            font-size: 12px;
            padding: 5px 10px;
            border-top: 1px solid #2a3143;
            overflow: hidden;
            white-space: nowrap;
        }
    </style>
    
    <!-- โหลด Three.js สำหรับสร้างกราฟิก 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="viewport-3d"></div>

    <div id="top-bar">
        <button class="btn-run" onclick="runSimulation()">▶ RUN</button>
        <button class="btn-stop" onclick="resetScene()">↻ RESET</button>
    </div>

    <div id="bottom-editor">
        <!-- เราใส่โค้ดจำลองให้เห็นว่า C++ ควบคุมแกน Y ยังไง -->
        <textarea id="code-area" spellcheck="false">// ลองเปลี่ยนค่า posY เป็นตัวเลขอื่นดู (เช่น 2.0 หรือ 10.0)
float posY = 5.0;

CreateCube("MyBox", 0.0, posY, 0.0);</textarea>
        <div id="console-area">> System Ready.</div>
    </div>

    <script>
        // --- 1. ตั้งค่าพื้นฐานโลก 3D (Three.js) ---
        let scene, camera, renderer;
        let objects = []; // เก็บวัตถุที่เราสร้างขึ้นเพื่อเคลียร์ทีหลังได้

        function init3D() {
            const container = document.getElementById('viewport-3d');
            
            // สร้าง Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1e2d); // สีพื้นหลังอวกาศ
            scene.fog = new THREE.Fog(0x1a1e2d, 10, 50); // หมอกบางๆ

            // สร้างกล้อง (มุมมอง)
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 5, 15);
            camera.lookAt(0, 0, 0);

            // ตัวเรนเดอร์ภาพ
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // ช่วยเรื่อง Performance บนมือถือ
            container.appendChild(renderer.domElement);

            // เพิ่มแสงสว่าง
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // เพิ่มพื้น (Grid) ให้ดูมีความลึก
            const gridHelper = new THREE.GridHelper(30, 30, 0x00e5ff, 0x444444);
            scene.add(gridHelper);

            // เริ่มการวาดภาพ
            animate();
        }

        // ฟังก์ชันวาดภาพซ้ำๆ (Loop) สำหรับ 3D
        function animate() {
            requestAnimationFrame(animate);
            // ถ้ามีวัตถุในฉาก ให้มันหมุนนิดหน่อยให้ดูมีชีวิต
            objects.forEach(obj => {
                obj.rotation.x += 0.01;
                obj.rotation.y += 0.01;
            });
            renderer.render(scene, camera);
        }

        // ปรับขนาด 3D เมื่อหมุนจอหรือเปลี่ยนขนาด
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // เริ่มต้น 3D เมื่อโหลดหน้าเว็บเสร็จ
        init3D();

        // --- 2. ระบบแปลภาษาจำลอง (Mock-up) ให้ปุ่ม RUN ---
        
        function getConsole() {
            return document.getElementById('console-area');
        }

        // เคลียร์วัตถุเก่าๆ ทิ้งก่อนรันใหม่
        function resetScene() {
            objects.forEach(obj => scene.remove(obj));
            objects = [];
            getConsole().innerText = "> Scene reset.";
        }

        // ฟังก์ชันนี้จะถูกเรียกเมื่อกดปุ่ม ▶ RUN
        function runSimulation() {
            resetScene(); // ล้างของเก่า
            const code = document.getElementById('code-area').value;
            const consoleOut = getConsole();
            
            consoleOut.innerText = "> Compiling...";

            // --- นี่คือจุดสำคัญ: เราจำลองการตีความโค้ด C++ (Regex เบื้องต้น) ---
            try {
                // ค้นหาบรรทัดที่ตั้งค่า posY
                const yMatch = code.match(/float\s+posY\s*=\s*([-0-9.]+);/);
                let yValue = 0;
                
                if (yMatch) {
                    yValue = parseFloat(yMatch[1]);
                    consoleOut.innerText = `> Variable posY set to ${yValue}`;
                }

                // ค้นหาคำสั่ง CreateCube
                if (code.includes("CreateCube")) {
                    // สร้างกล่อง 3D
                    const geometry = new THREE.BoxGeometry(2, 2, 2);
                    const material = new THREE.MeshStandardMaterial({ 
                        color: 0x00e5ff, // สีฟ้า Neon
                        wireframe: false 
                    });
                    const cube = new THREE.Mesh(geometry, material);
                    
                    // นำค่า Y ที่หาเจอจากโค้ดมาใช้
                    cube.position.set(0, yValue, 0); 
                    
                    scene.add(cube);
                    objects.push(cube);
                    
                    setTimeout(() => {
                        consoleOut.innerText = `> Object created at Y: ${yValue}`;
                    }, 500);
                } else {
                    consoleOut.innerText = "> Error: No CreateCube command found.";
                }

            } catch (error) {
                consoleOut.innerText = "> Syntax Error!";
            }
        }
    </script>
</body>
</html>
